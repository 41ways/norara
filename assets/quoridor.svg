<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 108">
  <defs>
    <linearGradient id="post" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5c3b"/><stop offset=".55" stop-color="#5f3c23"/><stop offset="1" stop-color="#3a2314"/>
    </linearGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0cf"/><stop offset=".5" stop-color="#ecc98c"/><stop offset="1" stop-color="#b98a4c"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4d2c"/><stop offset="1" stop-color="#3f2515"/>
    </linearGradient>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="11" height="22" fill="url(#stripe)"/>
    </pattern>
    <clipPath id="top"><rect x="6" y="26" width="108" height="24" rx="7"/></clipPath>
    <clipPath id="low"><rect x="14" y="60" width="92" height="15" rx="5"/></clipPath>
  </defs>

  <!-- 그림자 -->
  <ellipse cx="60" cy="100" rx="50" ry="5" fill="#000" opacity=".22"/>

  <!-- 기둥 -->
  <rect x="20" y="20" width="13" height="78" rx="4" fill="url(#post)"/>
  <rect x="87" y="20" width="13" height="78" rx="4" fill="url(#post)"/>
  <rect x="13" y="93" width="27" height="8" rx="3" fill="#3a2314"/>
  <rect x="80" y="93" width="27" height="8" rx="3" fill="#3a2314"/>
  <circle cx="26.5" cy="19" r="6.5" fill="url(#maple)" stroke="#6b4420" stroke-width="1.5"/>
  <circle cx="93.5" cy="19" r="6.5" fill="url(#maple)" stroke="#6b4420" stroke-width="1.5"/>

  <!-- 윗 가로대 -->
  <rect x="6" y="29" width="108" height="24" rx="7" fill="#5a3a1c" opacity=".55"/>
  <g clip-path="url(#top)">
    <rect x="6" y="26" width="108" height="24" fill="url(#maple)"/>
    <rect x="6" y="26" width="108" height="24" fill="url(#stripes)"/>
    <path d="M6 33 C30 31 50 35 72 32 S104 31 114 34" stroke="#fff" stroke-opacity=".22" stroke-width="1.2" fill="none"/>
    <path d="M6 43 C28 45 54 41 78 44 S104 44 114 42" stroke="#3a2314" stroke-opacity=".18" stroke-width="1" fill="none"/>
  </g>
  <rect x="6.75" y="26.75" width="106.5" height="22.5" rx="6.5" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- 아랫 가로대 -->
  <rect x="14" y="62" width="92" height="15" rx="5" fill="#5a3a1c" opacity=".5"/>
  <g clip-path="url(#low)">
    <rect x="14" y="60" width="92" height="15" fill="url(#maple)"/>
    <rect x="14" y="60" width="92" height="15" fill="url(#stripes)"/>
  </g>
  <rect x="14.75" y="60.75" width="90.5" height="13.5" rx="4.5" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
</svg>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모니터 클리너</title>
<meta name="description" content="귀여운 친구가 모니터를 닦아줍니다.">
<meta property="og:title" content="모니터 클리너">
<meta property="og:description" content="귀여운 친구가 모니터를 닦아줍니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
:root{
  --bar:rgba(255,255,255,.62);
  --ink:#1d2330;
  --ink2:#5a6273;
  --card:#fffdf8;
  --accent:#ff7a59;
  --R:80px;                       /* 청소기 반지름 — 화면 크기 따라 스크립트가 고친다 */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  background:#9cc7f0;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* 바탕화면 — 초록은 안 씀 */
#desk{
  position:fixed;inset:0;overflow:hidden;touch-action:none;
  background:
    radial-gradient(60% 50% at 18% 22%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(50% 60% at 85% 80%,rgba(255,196,150,.75),transparent 70%),
    radial-gradient(45% 45% at 70% 25%,rgba(190,170,255,.55),transparent 70%),
    linear-gradient(160deg,#8fc1f2 0%,#b9c8f5 45%,#ffd3b0 100%);
}
#slime{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* 메뉴 막대 */
.menubar{
  position:fixed;left:0;right:0;top:0;height:30px;z-index:20;
  display:flex;align-items:center;gap:18px;padding:0 14px;
  padding-top:env(safe-area-inset-top);box-sizing:content-box;
  background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  font-size:13px;box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.menubar b{font-weight:700}
.menubar .m{color:var(--ink2)}
.menubar .sp{flex:1}
.menubar .left{font-variant-numeric:tabular-nums}
.menubar>*{white-space:nowrap}
@media (max-width:560px){.menubar .m{display:none}}
@media (max-width:400px){#clock{display:none}}

/* 파일 아이콘 */
.ico{
  position:absolute;z-index:2;width:84px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  pointer-events:none;
  --w:0;
  transform:translate(-50%,-50%) rotate(calc(var(--w) * var(--sway) * 1deg)) scale(calc(1 - var(--w) * .12));
  transition:opacity .2s;
}
.ico .e{
  position:relative;font-size:42px;line-height:1;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)) saturate(calc(1 + var(--w) * .8)) blur(calc(var(--w) * .8px));
}
/* 침 묻은 광택 */
.ico .e::after{
  content:"";position:absolute;inset:-4px -6px;border-radius:40%;
  background:
    radial-gradient(30% 22% at 35% 28%,rgba(255,255,255,.95),transparent 70%),
    radial-gradient(60% 50% at 50% 60%,rgba(200,230,255,.55),transparent 75%);
  opacity:calc(var(--w) * 1.1);
}
.ico .t{
  max-width:84px;padding:1px 5px;border-radius:4px;
  font-size:11.5px;line-height:1.25;text-align:center;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.55);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;
  filter:blur(calc(var(--w) * 1.2px));
}
.ico.born{animation:born .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes born{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
.ico.gone{transition:transform .28s cubic-bezier(.5,0,.9,.4),opacity .28s;opacity:0}

/* 청소기 강아지 */
#dog{
  position:absolute;left:0;top:0;z-index:10;
  width:calc(var(--R) * 2);height:calc(var(--R) * 2);
  margin:calc(var(--R) * -1) 0 0 calc(var(--R) * -1);
  pointer-events:none;will-change:transform;
}
#dog .body{
  position:absolute;inset:0;border-radius:50%;
  padding:9px;
  background:conic-gradient(from 200deg,#f4f5f7,#c9ced6,#eef0f3,#b8bec8,#f4f5f7);
  box-shadow:0 14px 28px rgba(20,30,60,.28),0 3px 6px rgba(20,30,60,.2),inset 0 -3px 0 rgba(0,0,0,.08);
  transition:inset .9s cubic-bezier(.6,0,.2,1),border-radius .9s,padding .9s;
}
#dog .face{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#e9dccb;transition:border-radius .9s}
#dog video,#dog img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
#dog .led{
  position:absolute;right:13%;top:10%;width:9px;height:9px;border-radius:50%;
  background:#35c2ff;box-shadow:0 0 8px #35c2ff;animation:led 1.6s infinite;
  transition:opacity .4s;
}
@keyframes led{50%{opacity:.25}}
#dog.licking .face{animation:nom .3s ease-in-out infinite alternate}
@keyframes nom{to{transform:scale(1.04)}}

/* 끝 — 화면 가득 핥기 */
body.finale #dog{
  transform:none !important;transition:none;
  left:50%;top:50%;
  width:max(120vw,120vh);height:max(120vw,120vh);
  margin:calc(max(120vw,120vh) / -2) 0 0 calc(max(120vw,120vh) / -2);
  z-index:30;
}
body.finale #dog .body{padding:0;border-radius:0;background:none;box-shadow:none}
body.finale #dog .face{border-radius:0;animation:none}
body.finale #dog .led{opacity:0}
body.finale .menubar,body.finale .dock,body.finale .hint{opacity:0;pointer-events:none}
#dog.grow{transition:left .9s cubic-bezier(.6,0,.2,1),top .9s cubic-bezier(.6,0,.2,1),width .9s cubic-bezier(.6,0,.2,1),height .9s cubic-bezier(.6,0,.2,1),margin .9s cubic-bezier(.6,0,.2,1)}

/* 화면에 묻은 침 — 끝에서만 */
#smear{
  position:fixed;inset:0;z-index:31;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:
    radial-gradient(22% 16% at 38% 46%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(30% 24% at 55% 58%,rgba(215,235,255,.45),transparent 72%),
    radial-gradient(12% 30% at 62% 40%,rgba(255,255,255,.35),transparent 70%),
    radial-gradient(18% 10% at 30% 66%,rgba(255,255,255,.3),transparent 70%);
  filter:blur(2px);
}
body.smeared #smear{opacity:1}

.done{
  position:fixed;left:50%;top:50%;z-index:40;
  transform:translate(-50%,-44%) scale(.9);opacity:0;pointer-events:none;
  width:min(340px,calc(100vw - 32px));
  background:var(--card);border-radius:22px;padding:12px 12px 16px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s;
}
.done.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.done video{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;margin-bottom:12px;background:#222}
.done h2{margin:0 0 4px;font-size:19px}
.done p{margin:0 0 14px;color:var(--ink2);font-size:14px;line-height:1.5}
.done button{font-size:15px;padding:11px 18px}

/* 아래 단추 줄 */
.dock{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;gap:6px;padding:6px;border-radius:18px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 24px rgba(20,30,60,.18),inset 0 0 0 1px rgba(255,255,255,.6);
  transition:opacity .4s;
}
button{
  font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
  border:0;border-radius:12px;padding:9px 13px;background:rgba(255,255,255,.8);cursor:pointer;
  white-space:nowrap;
}
button:hover{background:#fff}
button:active{transform:scale(.96)}
button.hot{background:var(--accent);color:#fff}
button.hot:hover{background:#ff6a45}

.hint{
  position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top));transform:translateX(-50%);z-index:20;
  max-width:calc(100vw - 32px);
  padding:8px 14px;border-radius:999px;font-size:13px;
  background:rgba(29,35,48,.78);color:#fff;
  transition:opacity .6s;text-align:center;
}
.hint.off{opacity:0}
</style>
</head>

<script>
(function () {
  "use strict";
  var desk = document.getElementById("desk");
  var dog = document.getElementById("dog");
  var vid = document.getElementById("vid");
  var cv = document.getElementById("slime");
  var cx = cv.getContext("2d");
  var leftEl = document.getElementById("left");
  var hint = document.getElementById("hint");
  var modeBtn = document.getElementById("mode");
  var sndBtn = document.getElementById("snd");
  var doneBox = document.getElementById("done");

  /* ---------- 파일 이름들 ---------- */
  var FILES = [
    ["📁", "새 폴더"], ["📁", "새 폴더 (2)"], ["📁", "새 폴더 (37)"], ["📁", "과제"], ["📁", "진짜 과제"],
    ["📁", "사진 정리 예정"], ["📁", "옛날 바탕화면"], ["📁", "건드리지 마"],
    ["📄", "최종.hwp"], ["📄", "최종_진짜.hwp"], ["📄", "최종_진짜_최종.hwp"], ["📄", "최종(수정)(수정).docx"],
    ["📄", "이력서_v7.docx"], ["📝", "ㅁㄴㅇㄹ.txt"], ["📝", "메모.txt"], ["📝", "비번 아님.txt"], ["📝", "지우지 마.txt"],
    ["🖼️", "스크린샷 2026-09-18 오후 3.02.11.png"], ["🖼️", "캡처.PNG"], ["🖼️", "캡처(2).PNG"], ["🖼️", "IMG_4821.HEIC"],
    ["🖼️", "짤.gif"], ["🖼️", "고양이.jpg"], ["🖼️", "배경화면후보.jpg"],
    ["🗜️", "다운로드 (3).zip"], ["🗜️", "압축풀기전.zip"], ["🗜️", "폰트모음.zip"],
    ["💿", "설치파일.dmg"], ["💿", "setup (1).exe"],
    ["🎵", "녹음 001.m4a"], ["🎵", "노동요.mp3"],
    ["📊", "가계부.xlsx"], ["📊", "가계부_포기.xlsx"],
    ["📑", "이거 뭐지.pdf"], ["📑", "영수증.pdf"], ["📑", "계약서_스캔.pdf"],

  ];

  /* ---------- 크기 ---------- */
  var W = 0, H = 0, R = 80, DPR = 1, TOP = 34, BOT = 70;
  function size() {
    var oW = W, oH = H;
    W = innerWidth; H = innerHeight;
    // 창 크기가 바뀌면 파일도 같은 비율로 옮긴다
    if (oW > 200 && oH > 200) icons.forEach(function (o) {
      o.x = Math.max(44, Math.min(W - 44, o.x * W / oW));
      o.y = Math.max(TOP + 34, Math.min(H - BOT - 10, TOP + (o.y - TOP) * (H - TOP) / (oH - TOP)));
      o.el.style.left = o.x + "px"; o.el.style.top = o.y + "px";
    });
    R = Math.round(Math.max(52, Math.min(84, Math.min(W, H) * 0.12)));
    document.documentElement.style.setProperty("--R", R + "px");
    DPR = Math.min(2, devicePixelRatio || 1);
    var img = null;
    if (cv.width) { img = document.createElement("canvas"); img.width = cv.width; img.height = cv.height; img.getContext("2d").drawImage(cv, 0, 0); }
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (img) cx.drawImage(img, 0, 0, img.width / DPR, img.height / DPR);
  }
  addEventListener("resize", function () { size(); if (!laid) boot(); });

  /* ---------- 파일 뿌리기 ---------- */
  var icons = [], laid = false;
  size();
  var cleaned = 0, started = 0, reported = false;

  function addIcon(x, y, pick, delay) {
    var f = pick || FILES[(Math.random() * FILES.length) | 0];
    var name = f[1];
    var same = icons.filter(function (o) { return o.base === f[1]; }).length;
    if (same) name = name.replace(/(\.[^.]+)?$/, function (ext) { return " (" + (same + 1) + ")" + ext; });
    var el = document.createElement("div");
    el.className = "ico born";
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.setProperty("--sway", (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 10));
    if (delay) el.style.animationDelay = delay + "ms";
    el.innerHTML = '<span class="e"></span><span class="t"></span>';
    el.firstChild.textContent = f[0];
    el.lastChild.textContent = name;
    desk.appendChild(el);
    var o = { el: el, x: x, y: y, w: 0, base: f[1], dead: false };
    icons.push(o);
    return o;
  }

  function scatter() {
    icons.forEach(function (o) { o.el.remove(); });
    icons = [];
    var n = Math.round(Math.max(14, Math.min(46, (W * H) / 16000)));
    var pool = FILES.slice().sort(function () { return Math.random() - .5; });
    // 격자에 반쯤 맞춰 뿌린다 — 너무 가지런하면 바탕화면 같지 않고, 완전히 무작위면 겹쳐서 안 보인다
    var cols = Math.max(3, Math.floor((W - 40) / 96)), rows = Math.max(3, Math.floor((H - TOP - BOT - 20) / 96));
    var cells = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) cells.push([c, r]);
    cells.sort(function () { return Math.random() - .5; });
    var cw = (W - 40) / cols, ch = (H - TOP - BOT - 20) / rows;
    for (var i = 0; i < n; i++) {
      var cell = cells[i % cells.length];
      var x = 20 + cw * (cell[0] + .5) + (Math.random() - .5) * cw * .5;
      var y = TOP + 20 + ch * (cell[1] + .5) + (Math.random() - .5) * ch * .5;
      addIcon(x, y, pool[i % pool.length], i * 25);
    }
    cleaned = 0; started = performance.now(); reported = false;
    countLeft();
  }

  function countLeft() {
    var n = icons.filter(function (o) { return !o.dead; }).length;
    leftEl.textContent = "남은 파일 " + n;
    return n;
  }

  /* ---------- 소리 — 핥는 소리를 잡음으로 만든다 ---------- */
  var ac = null, noise = null, soundOn = true;
  try { soundOn = localStorage.getItem("mung-sound") !== "0"; } catch (e) {}
  sndBtn.textContent = soundOn ? "🔊" : "🔇";
  function audio() {
    if (ac || !soundOn) return;
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    ac = new A();
    noise = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
    var d = noise.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function lick(big) {
    if (!soundOn || !ac) return;
    if (ac.state === "suspended") ac.resume();
    var t = ac.currentTime, dur = big ? .32 : .18;
    var s = ac.createBufferSource(); s.buffer = noise;
    var f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = big ? 3 : 5;
    f.frequency.setValueAtTime(big ? 500 : 900, t);
    f.frequency.exponentialRampToValueAtTime(big ? 2200 : 1700, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(big ? .5 : .16, t + .03);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t, Math.random() * .2); s.stop(t + dur + .02);
    if (big) {   // 꿀꺽
      var o = ac.createOscillator(), og = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(380, t + .2); o.frequency.exponentialRampToValueAtTime(120, t + .34);
      og.gain.setValueAtTime(0, t + .2); og.gain.linearRampToValueAtTime(.3, t + .22); og.gain.exponentialRampToValueAtTime(.001, t + .36);
      o.connect(og); og.connect(ac.destination); o.start(t + .2); o.stop(t + .4);
    }
  }

  /* ---------- 조작 ---------- */
  var dx = W / 2, dy = H / 2, vx = 0, vy = 0;       // 강아지 자리·속도
  var tx = dx, ty = dy;                              // 가려는 곳
  var lastMove = performance.now() + 1500, auto = false, forceAuto = false, touched = false;
  var target = null, wander = 0;

  function firstTouch() {
    if (touched) return;
    touched = true;
    audio();
    vid.play && vid.play().catch(function () {});
    setTimeout(function () { hint.classList.add("off"); }, 2500);
  }
  desk.addEventListener("pointermove", function (e) {
    if (document.body.classList.contains("finale")) return;
    tx = e.clientX; ty = e.clientY; lastMove = performance.now();
    if (e.pointerType !== "mouse" || touched) firstTouch();
  });
  desk.addEventListener("pointerdown", function (e) {
    if (document.body.classList.contains("finale")) return;
    firstTouch();
    tx = e.clientX; ty = e.clientY; lastMove = performance.now();
  });
  // 빈 곳 두 번 누르면 새 폴더 — 청소하는 옆에서 또 어지르기
  desk.addEventListener("dblclick", function (e) {
    if (document.body.classList.contains("finale")) return;
    addIcon(e.clientX, e.clientY, ["📁", "새 폴더"]);
    countLeft();
  });
  addEventListener("keydown", function () { firstTouch(); });

  document.getElementById("mess").onclick = function () { firstTouch(); scatter(); };
  modeBtn.onclick = function () {
    firstTouch();
    forceAuto = !forceAuto;
    modeBtn.textContent = forceAuto ? "🤖 자동" : "✋ 따라오기";
  };
  sndBtn.onclick = function () {
    soundOn = !soundOn;
    try { localStorage.setItem("mung-sound", soundOn ? "1" : "0"); } catch (e) {}
    sndBtn.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) { audio(); lick(false); }
  };
  document.getElementById("again").onclick = reset;

  /* ---------- 침 자국 ---------- */
  var slimeT = 0, dryT = 0;
  function drool(x, y, sp) {
    // 지나간 자리에 번들번들한 얼룩 — 빨리 달리면 길게 끌린다
    var r = R * (.55 + Math.min(sp, 600) / 1600);
    var g = cx.createRadialGradient(x - r * .25, y - r * .3, r * .05, x, y, r);
    g.addColorStop(0, "rgba(255,255,255,.10)");
    g.addColorStop(.6, "rgba(225,240,255,.05)");
    g.addColorStop(1, "rgba(225,240,255,0)");
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
    if (Math.random() < .08) {        // 침방울
      var bx = x + (Math.random() - .5) * r * 1.6, by = y + (Math.random() - .5) * r * 1.6, br = 2 + Math.random() * 5;
      cx.fillStyle = "rgba(235,245,255,.35)";
      cx.beginPath(); cx.arc(bx, by, br, 0, 7); cx.fill();
      cx.fillStyle = "rgba(255,255,255,.8)";
      cx.beginPath(); cx.arc(bx - br * .35, by - br * .35, br * .3, 0, 7); cx.fill();
    }
  }
  function dry() {
    // 천천히 마른다
    cx.save();
    cx.globalCompositeOperation = "destination-out";
    cx.fillStyle = "rgba(0,0,0,.025)";
    cx.fillRect(0, 0, W, H);
    cx.restore();
  }

  /* ---------- 먹기 ---------- */
  function slurp(o) {
    o.dead = true;
    cleaned++;
    lick(true);
    var el = o.el;
    el.classList.add("gone");
    // 입 쪽으로 빨려 들어간다
    el.style.transform = "translate(-50%,-50%) translate(" + (dx - o.x) + "px," + (dy + R * .25 - o.y) + "px) scale(.1) rotate(" + (Math.random() < .5 ? -1 : 1) * 90 + "deg)";
    setTimeout(function () { el.remove(); }, 320);
    icons = icons.filter(function (i) { return i !== o; });
    if (!countLeft()) setTimeout(finale, 450);
  }

  /* ---------- 끝 ---------- */
  var inFinale = false;
  function finale() {
    if (inFinale || icons.length) return;
    inFinale = true;
    var sec = Math.round((performance.now() - started) / 1000);
    if (!reported && window.norara) { reported = true; window.norara.ev("end", { n: cleaned, sec: sec }); }
    dog.classList.add("grow");
    dog.style.transform = "";
    dog.style.left = dx + "px"; dog.style.top = dy + "px";
    dog.getBoundingClientRect();
    document.body.classList.add("finale");
    dog.style.left = ""; dog.style.top = "";
    var n = 0, lk = setInterval(function () { lick(n % 3 === 2); if (++n > 8) clearInterval(lk); }, 280);
    setTimeout(function () { document.body.classList.add("smeared"); }, 1400);
    document.getElementById("doneTxt").textContent =
      "파일 " + cleaned + "개를 " + sec + "초 만에 먹어 치움. 화면은 알아서 닦으셈.";
    setTimeout(function () {
      doneBox.classList.add("show");
      var v = document.getElementById("vthumb");   // 한 번만 틀고 엄지 든 채로 멈춘다
      try { v.currentTime = 0; } catch (e) {}
      v.play && v.play().catch(function () {});
    }, 2200);
  }
  function reset() {
    doneBox.classList.remove("show");
    document.body.classList.remove("smeared");
    dog.classList.remove("grow");
    document.body.classList.remove("finale");
    dx = W / 2; dy = H / 2; tx = dx; ty = dy; vx = vy = 0;
    cx.clearRect(0, 0, W, H);
    inFinale = false;
    scatter();
    if (window.norara) window.norara.ev("start", {});
  }

  /* ---------- 한 프레임 ---------- */
  var prev = performance.now(), lickT = 0;
  function frame(now) {
    var dt = Math.min(.05, (now - prev) / 1000); prev = now;
    if (!inFinale) {
      auto = forceAuto || now - lastMove > 2500;
      if (auto) {
        // 가장 가까운 파일로 간다. 가끔 딴짓.
        if (!target || target.dead) {
          var best = null, bd = 1e18;
          icons.forEach(function (o) {
            var d = (o.x - dx) * (o.x - dx) + (o.y - dy) * (o.y - dy);
            if (d < bd) { bd = d; best = o; }
          });
          target = best;
        }
        wander += dt;
        if (target) {
          var ax = target.x - dx, ay = target.y - dy, d = Math.hypot(ax, ay) || 1;
          var sp = 230, wob = Math.sin(wander * 3) * .5;
          var ux = ax / d, uy = ay / d;
          tx = dx + (ux * Math.cos(wob) - uy * Math.sin(wob)) * sp * .25;
          ty = dy + (ux * Math.sin(wob) + uy * Math.cos(wob)) * sp * .25;
        } else {
          tx = W / 2 + Math.cos(wander * .6) * W * .25;
          ty = H / 2 + Math.sin(wander * .9) * H * .2;
        }
      } else target = null;

      var k = 1 - Math.exp(-dt * (auto ? 6 : 9));
      var nx = dx + (tx - dx) * k, ny = dy + (ty - dy) * k;
      nx = Math.max(R * .6, Math.min(W - R * .6, nx));
      ny = Math.max(TOP + R * .4, Math.min(H - R * .6, ny));
      vx = (nx - dx) / (dt || 1e-3); vy = (ny - dy) / (dt || 1e-3);
      dx = nx; dy = ny;
      var speed = Math.hypot(vx, vy);
      var tilt = Math.max(-16, Math.min(16, vx / 40));
      dog.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + tilt + "deg)";

      // 핥기 — 가까울수록 빨리 젖는다
      var any = false;
      for (var i = icons.length - 1; i >= 0; i--) {
        var o = icons[i];
        if (o.dead) continue;
        var dd = Math.hypot(o.x - dx, o.y - dy);
        if (dd < R * 1.05) {
          any = true;
          o.w += dt * (1.1 + (1 - dd / (R * 1.05)) * 1.6);
          if (o.w >= 1) { slurp(o); continue; }
        } else if (o.w > 0) {
          o.w = Math.max(0, o.w - dt * .15);       // 떨어지면 조금씩 마른다
        }
        o.el.style.setProperty("--w", o.w.toFixed(3));
        if (o.w > 0) o.el.style.transform = "translate(-50%,-50%) rotate(" + (Math.sin(now / 70 + i) * o.w * 10) + "deg) scale(" + (1 - o.w * .12) + ")";
      }
      dog.classList.toggle("licking", any);
      lickT -= dt;
      if (any && lickT <= 0) { lick(false); lickT = .38 + Math.random() * .15; }

      slimeT += dt;
      if (speed > 20 && slimeT > .03) { slimeT = 0; drool(dx, dy + R * .15, speed); }
      dryT += dt;
      if (dryT > .25) { dryT = 0; dry(); }
    }
    requestAnimationFrame(frame);
  }

  // 시계
  function tick() {
    var d = new Date();
    document.getElementById("clock").textContent =
      (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + (d.getHours() < 12 ? "오전 " : "오후 ") +
      ((d.getHours() % 12) || 12) + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tick(); setInterval(tick, 10000);

  // 동영상이 안 되면 포스터 그림이 남는다
  vid.addEventListener("playing", function () { dog.querySelector(".poster").style.display = "none"; });

  // 창이 아직 안 펴졌으면(크기 0) 펴질 때까지 기다렸다가 뿌린다
  function boot() {
    if (laid || W < 200 || H < 200) return;
    laid = true;
    dx = tx = W / 2; dy = ty = H / 2;
    scatter();
  }
  boot();
  setTimeout(function () { window.norara && window.norara.ev("start", {}); }, 0);   // 조각이 이 스크립트보다 뒤에 있다
  requestAnimationFrame(frame);
})();
</script>

<!-- 방문 통계와 오류 수집 — 허브와 같은 곳으로 모인다.
     GoatCounter 는 쿠키를 쓰지 않고 개인을 가려내지 않는다. 오류는 메시지·파일·줄만 보낸다. -->
<script>
(function () {
  var APP = "doggo-cleaner";

  window.goatcounter = { path: APP };
  var sc = document.createElement("script");
  sc.async = true;
  sc.src = "https://gc.zgo.at/count.js";
  sc.setAttribute("data-goatcounter", "https://41ways.goatcounter.com/count");
  document.head.appendChild(sc);

  window.norara = {
    ev: function (name, o) {
      o = o || {};
      o.app = APP;
      o.ev = name;
      try {
        navigator.sendBeacon("https://norara-errors.41ways.workers.dev/ev", JSON.stringify(o));
      } catch (e) {}
    }
  };

  var came = Date.now(), told = false;
  function leaving() {
    if (told) return;
    told = true;
    var sec = Math.round((Date.now() - came) / 1000);
    if (sec >= 5) window.norara.ev("visit", { sec: sec });
  }
  addEventListener("pagehide", leaving);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") leaving();
  });

  var left = 5;
  function send(o) {
    if (left-- <= 0) return;
    o.app = APP;
    o.page = location.pathname + location.search;
    try {
      navigator.sendBeacon("https://norara-errors.41ways.workers.dev/report", JSON.stringify(o));
    } catch (e) {}
  }
  addEventListener("error", function (e) {
    if (!e.message) return;
    send({ msg: e.message, src: e.filename, line: e.lineno, col: e.colno,
           stack: e.error && e.error.stack });
  });
  addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    send({ msg: "처리되지 않은 거절: " + ((r && r.message) || r), stack: r && r.stack });
  });
})();
</script>
</body>
</html>

# norara 오류 수집 — Cloudflare Workers 무료 플랜 + D1
# 게임 화면에서 터진 오류를 한곳에 모은다. 같은 오류는 한 줄에 쌓아 세기만 한다.
# 결제 수단을 등록하지 않았으므로 한도를 넘어도 요금이 붙지 않고 그날 요청만 거절된다.
name = "norara-errors"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "norara-errors"
database_id = "c650bcaa-8d9b-4e5e-902c-676135f5dbe7"
